services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dragons
      POSTGRES_USER: dragons
      POSTGRES_PASSWORD: dragons
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragons -d dragons"]
      interval: 3s
      timeout: 3s
      retries: 20

  dragon-service:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"

volumes:
  pgdata:
