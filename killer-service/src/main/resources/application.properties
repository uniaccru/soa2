# Все значения можно переопределить переменной окружения (service1.url -> SERVICE1_URL)
# или системным свойством -Dservice1.url=...
service1.url=https://localhost:8443/dragon-service
# Путь к truststore (PKCS12) с сертификатом сервиса 1; пусто = стандартный truststore JVM
service1.truststore.path=
service1.truststore.password=changeit
service1.connect-timeout-ms=3000
service1.read-timeout-ms=10000
# Размер страницы при обходе коллекции драконов сервиса 1
service1.page-size=100
