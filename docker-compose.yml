services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dragons
      POSTGRES_USER: dragons
      POSTGRES_PASSWORD: dragons
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragons -d dragons"]
      interval: 3s
      timeout: 3s
      retries: 20

  dragon-service:            # сервис 1, WildFly
    build: ./dragon-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      # origins, с которых браузеру разрешены запросы
      CORS_ALLOWED_ORIGINS: "https://se.ifmo.ru,http://localhost:5173,http://localhost:3000"
    ports:
      - "8080:8080"
      - "8443:8443"

  killer-service:            # сервис 2, Payara
    build: ./killer-service
    depends_on:
      - dragon-service
    environment:
      # имя dragon-service должно быть в SAN сертификата
      SERVICE1_URL: https://dragon-service:8443/dragon-service
      # origins, с которых браузеру разрешены запросы
      CORS_ALLOWED_ORIGINS: "https://se.ifmo.ru,http://localhost:5173,http://localhost:3000"
    ports:
      - "9080:8080"          # http
      - "8181:8181"          # https (порт одинаковый снаружи и внутри: на него идёт редирект с http)

volumes:
  pgdata:
